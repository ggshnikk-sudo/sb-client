[package]
name = "sb-client"
version = "1.0.0"
description = "Лёгкий клиент SkinBase и CapeForge"
edition = "2021"
rust-version = "1.90"

[lib]
name = "sb_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Оптимизация размера, но без strip = true: мобильные JNI-символы
# (start_app / Java_app_tauri_*) должны оставаться в .so для Android/iOS.
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"
