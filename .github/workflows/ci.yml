name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Проверка исходников и секретов
        run: bash scripts/fix-sources.sh --check
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: clippy (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  desktop-smoke:
    name: Desktop smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Сборка без бандлов (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh --desktop --ci --no-bundle
      - name: Сборка без бандлов (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npx tauri build --no-bundle --ci

  android-smoke:
    name: Android smoke (debug, 1 target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-android
      - name: Debug APK (без секретов)
        shell: bash
        run: bash scripts/build.sh --android --ci --debug --targets aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: android-smoke-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1
