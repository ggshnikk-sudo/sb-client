name: Setup SB Client build environment
description: Устанавливает Node, Rust, системные библиотеки и npm-зависимости

inputs:
  installDeps:
    description: Ставить ли системные зависимости ОС
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Node 20 + npm cache
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        cache-on-failure: true

    - name: Linux build dependencies
      if: runner.os == 'Linux' && inputs.installDeps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential curl wget file pkg-config \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev patchelf libxdo-dev libssl-dev

    - name: macOS build dependencies
      if: runner.os == 'macOS' && inputs.installDeps == 'true'
      shell: bash
      run: |
        xcode-select -p >/dev/null || {
          echo "Xcode Command Line Tools не установлены" >&2
          exit 1
        }

    - name: npm dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
